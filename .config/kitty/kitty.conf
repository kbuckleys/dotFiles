# ┌─┐┌─┐┌┐┌┬ ┬┌─┐┬─┐┬┌─┌─┐
# ┌─┘├┤ │││││││ │├┬┘├┴┐└─┐
# └─┘└─┘┘└┘└┴┘└─┘┴└─┴ ┴└─┘
# https://github.com/kbuckleys/

# ── font ────────────────────────────────────────────────────────────
font_family      family="JetBrainsMono Nerd Font Mono" style=Medium
bold_font        family="JetBrainsMono Nerd Font Mono" style=Bold
italic_font      family="JetBrainsMono Nerd Font Mono" style="Medium Italic"
bold_italic_font family="JetBrainsMono Nerd Font Mono" style="Bold Italic"
font_size        12.0

disable_ligatures never
modify_font cell_height 105%

# ── cursor ──────────────────────────────────────────────────────────
# Cursor *color* lives in zenon.conf, which is included at the bottom of this
# file and therefore wins on any duplicate. Shape and trail are set here.
cursor_shape                 block

# Pulsate rather than hard-blink: the easing function animates the cursor's
# alpha, so 0.5 ease-in-out fades opaque -> transparent over half a second and
# back over the next half. Costs extra power — the screen is redrawn several
# times per cycle. Blinking *text* rides the same rhythm.
cursor_blink_interval        0.5 ease-in-out
# The pulse stops after this many seconds of keyboard inactivity; 0 = never stop.
cursor_stop_blinking_after   15.0

# Trail follows cursors that have held still for >3ms, so it fires on real
# jumps but not on the rapid repaints of TUIs like nvim.
cursor_trail                 3
# fastest / slowest decay in seconds — lower is snappier
cursor_trail_decay           0.08 0.35
# minimum cells moved (x y) before a trail is drawn
cursor_trail_start_threshold 2
cursor_trail_color           #c8a4e0

# ── scrollback ──────────────────────────────────────────────────────
scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── mouse ───────────────────────────────────────────────────────────
mouse_hide_wait         3.0
copy_on_select          no
strip_trailing_spaces   smart

# ── bell ────────────────────────────────────────────────────────────
enable_audio_bell       no
# Flash the window instead of beeping. The easing suffix ramps the flash's alpha
# in and back out over the duration rather than hard-cutting it. The color is
# the palette red, the same #e78284 zenon.conf gives bell_border_color.
visual_bell_duration    0.15 ease-in-out
visual_bell_color       #e78284

# ── background ──────────────────────────────────────────────────────
# Only cells using the *default* background go translucent; any cell with an
# explicitly set bg stays opaque. That is exactly the layering zenon.lua wants:
# nvim sets Normal bg=NONE, so buffers show the desktop, while its floats are
# pinned to #000000 and stay the opaque surface they were designed to be.
background_opacity          0.80

# Blur is Hyprland's job — decoration.blur (passes = 2) in hypr/lua/base.lua
# already blurs translucent windows, so kitty's own background_blur stays 0.

# Enables the built-in ctrl+shift+a > / < / 1 / d opacity bindings. Costs a
# little performance, and cannot be toggled by a config reload — it only takes
# effect in a kitty started after this line was added.
dynamic_background_opacity  yes

# ── window ──────────────────────────────────────────────────────────
window_padding_width    0
window_border_width     1pt
draw_minimal_borders    yes
hide_window_decorations yes
confirm_os_window_close 0

# ── tabs ────────────────────────────────────────────────────────────
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"

# ── misc ────────────────────────────────────────────────────────────
# no-cursor: kitty otherwise forces a beam at every shell prompt, which fights
# zsh-vi-mode for control of the shape. Handing it over lets vi mode own it —
# beam in insert, block in normal.
shell_integration       enabled no-cursor
allow_remote_control    yes

# Exported into every shell kitty spawns, so $EDITOR is nvim without .zshrc
# needing to set it. `editor` is the separate option kitty uses for its own
# config editing; it defaults to $EDITOR, so this covers that too.
env                     EDITOR=nvim
term                    xterm-kitty
update_check_interval   0

# ── keymaps ─────────────────────────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window
map ctrl+shift+t     new_tab
map ctrl+shift+w     close_window
map ctrl+shift+h     previous_tab
map ctrl+shift+l     next_tab

# kitty binds ctrl+tab / ctrl+shift+tab to next_tab / previous_tab by default,
# so it swallowed them before nvim could see them (foot had no such binding,
# which is why they worked there). An empty action unmaps *and* forwards the key
# to the running program — unlike discard_event, which would eat it entirely.
map ctrl+tab
map ctrl+shift+tab
# zoom — ctrl+= / ctrl+- to step, ctrl+0 to reset.
# plus/shift+equal are the same physical key; keypad variants included.
map ctrl+equal       change_font_size all +1.0
map ctrl+plus        change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0
map ctrl+minus       change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# ── theme ───────────────────────────────────────────────────────────
include zenon.conf
