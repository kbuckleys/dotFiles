# zenon — mirrors ~/.config/nvim/lua/palette.lua
# Keep the 16 ANSI entries below in sync with that file; it is the source of truth.

# black          #000000
# lblack         #20242a
# white          #dfdfdd
# bright_black   #6a707f

foreground              #dfdfdd
background              #000000

# normal
color0                  #000000
color1                  #e78284
color2                  #b6e0a4
color3                  #fab387
color4                  #9fcbfc
color5                  #c8a4e0
color6                  #9bbfbf
color7                  #dfdfdd

# bright
color8                  #6a707f
color9                  #eebebe
color10                 #c1e8ac
color11                 #e0d8a4
color12                 #b3d4fd
color13                 #d4b7e8
color14                 #a8caca
color15                 #dfdfdd

# cursor — `none` means reverse video: the cursor takes the color of the text in
# the cell it sits on, and that text is drawn in the cell's background color.
# cursor_text_color is ignored in this mode, so it is deliberately unset.
# The trail keeps an explicit magenta; it would otherwise have no fixed color to
# inherit from a cursor that changes color cell by cell.
cursor                  none

# selection — matches nvim Visual (black on magenta)
selection_foreground    #000000
selection_background    #c8a4e0

# search / url
url_color               #9fcbfc

# splits & borders — lblack separators, as WinSeparator in nvim
active_border_color     #6a707f
inactive_border_color   #20242a
bell_border_color       #e78284

# tab bar — mirrors the bufferline setup
active_tab_foreground   #dfdfdd
active_tab_background   #000000
active_tab_font_style   bold
inactive_tab_foreground #6a707f
inactive_tab_background #20242a
inactive_tab_font_style normal
tab_bar_background      #20242a

# marks
mark1_foreground        #000000
mark1_background        #b6e0a4
mark2_foreground        #000000
mark2_background        #fab387
mark3_foreground        #000000
mark3_background        #9bbfbf
